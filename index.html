<style>
html,body{margin:0;background:#03111A;color:#F4F7F5;font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#E6C36A}a:hover{color:#F3D98F}
.pp-sky{background-color:#03111A;background-image:radial-gradient(1.2px 1.2px at 12% 18%,rgba(255,255,255,.55),transparent 60%),radial-gradient(1px 1px at 27% 9%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1.4px 1.4px at 46% 22%,rgba(255,255,255,.5),transparent 60%),radial-gradient(1px 1px at 63% 12%,rgba(255,255,255,.35),transparent 60%),radial-gradient(1.2px 1.2px at 78% 26%,rgba(255,255,255,.45),transparent 60%),radial-gradient(1px 1px at 91% 8%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1px 1px at 6% 38%,rgba(255,255,255,.3),transparent 60%),radial-gradient(1px 1px at 86% 41%,rgba(255,255,255,.3),transparent 60%),linear-gradient(180deg,#03111A 0%,#062228 52%,#0B3230 78%,#123A33 100%)}
.pp-flight{position:absolute;left:-260px;top:96px;animation:pp-fly 14s linear infinite;will-change:left,top}
.pp-plane{animation:pp-bob 3.2s ease-in-out infinite;transform-origin:60% 50%}
.pp-strobe{animation:pp-strobe 1.4s linear infinite}
.pp-strobe2{animation:pp-strobe 1.4s linear infinite .7s}
.pp-beacon{animation:pp-beacon 1s ease-in-out infinite}
.pp-nav{animation:pp-nav 1.2s ease-in-out infinite}
.pp-rise{animation:pp-rise .9s cubic-bezier(.2,.7,.2,1) both}
.pp-rise2{animation:pp-rise .9s cubic-bezier(.2,.7,.2,1) .15s both}
.pp-rise3{animation:pp-rise .9s cubic-bezier(.2,.7,.2,1) .3s both}
.pp-btn{transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.18),0 12px 30px rgba(0,0,0,.4);animation:pp-ring 2.4s ease-out infinite}
.pp-btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);transform:skewX(-20deg);animation:pp-shine 3.6s ease-in-out infinite;pointer-events:none}
.pp-btn:hover{transform:translateY(-3px);filter:brightness(1.05)}
.pp-btn:active{transform:translateY(0) scale(.98)}
.pp-btn:hover .pp-btn-icon{transform:translate(3px,-4px) rotate(-10deg)}
.pp-btn:hover .pp-btn-badge{background-color:#FFFFFF}
.pp-edge{animation:pp-edgeflash 1.6s ease-out infinite}
.pp-cl{animation:pp-edgeflash 1.6s ease-out infinite}
.pp-btn-badge{transition:background-color .2s ease}
.pp-btn:focus-visible{outline:3px solid #F4F7F5;outline-offset:4px}
.pp-btn-icon{transition:transform .25s ease}
@keyframes pp-fly{0%{left:-380px;top:96px}100%{left:calc(100% + 40px);top:30px}}
@keyframes pp-bob{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-4px) rotate(-1.5deg)}}
@keyframes pp-strobe{0%,80%,86%,100%{opacity:0}82%,84%,90%,92%{opacity:1}88%{opacity:0}}
@keyframes pp-beacon{0%,100%{opacity:.15}45%,55%{opacity:1}}
@keyframes pp-nav{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes pp-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pp-edgeflash{0%,100%{opacity:.35}8%{opacity:1}20%{opacity:.5}}
@keyframes pp-shine{0%,55%{left:-60%}85%,100%{left:130%}}
@keyframes pp-ring{0%{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.18),0 12px 30px rgba(0,0,0,.4),0 0 0 0 rgba(230,195,106,.5)}70%{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.18),0 12px 30px rgba(0,0,0,.4),0 0 0 20px rgba(230,195,106,0)}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.18),0 12px 30px rgba(0,0,0,.4),0 0 0 0 rgba(230,195,106,0)}}
@media (prefers-reduced-motion: reduce){.pp-flight{animation:none;left:8%;top:60px}.pp-plane,.pp-strobe,.pp-strobe2,.pp-nav,.pp-beacon,.pp-rise,.pp-rise2,.pp-rise3,.pp-btn,.pp-btn::after,.pilot,.top .name b,.top .name b em,.card.flash,.wingwrap,.wingwrap::after,.fr,.wave,.blink,.pp-edge,.pp-cl,.twr-beacon,.twr-glass,.rot-g,.rot-w,.papi,.ws,.ws-gust{animation:none}}

:root{
  --navy:#03111A; --royal:#0B302F; --gold:#F2C94C; --gold-deep:#B8862A; --ink:#F4F7F5; --muted:#C3D6CF;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.screen{position:relative;min-height:100vh;min-height:100svh;overflow:hidden}
/* plane */
.flight{position:absolute;top:calc(var(--safe-t) + 30px);left:-120px;width:84px;z-index:3;pointer-events:none;
  animation:fly 11s linear infinite;will-change:transform}
.flight .craft{position:relative;transform:rotate(-5deg);animation:bob 3s ease-in-out infinite}
.flight img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.trail{position:absolute;top:58%;right:62%;height:2px;border-radius:2px;pointer-events:none;
  background:linear-gradient(270deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.trail.t1{width:180px}
.trail.t2{width:120px;top:66%;opacity:.55}
.navlight{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%}
.navlight.red{left:11.4%;top:97%;background:#FF3B3B;box-shadow:0 0 6px 3px rgba(255,59,59,.85),0 0 14px 6px rgba(255,59,59,.45);animation:pulse 1.1s ease-in-out infinite}
.navlight.green{left:68.7%;top:1.5%;background:#2BFF7A;box-shadow:0 0 6px 3px rgba(43,255,122,.85),0 0 14px 6px rgba(43,255,122,.45);animation:pulse 1.1s ease-in-out infinite .55s}
.strobe{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 4px rgba(255,255,255,.9);opacity:0;animation:strobe 1.4s linear infinite}
.strobe.s1{left:11.4%;top:97%}.strobe.s2{left:68.7%;top:1.5%;animation-delay:.05s}.strobe.s3{left:3.2%;top:30%;animation-delay:.7s}
#cover.takeoff .flight{animation-duration:2.2s}
#cover{transition:transform .9s cubic-bezier(.7,0,.3,1),opacity .9s ease}
#cover.leaving{transform:translateY(-6%);opacity:0}
.pp-btn:active{transform:scale(.97)}

/* ---------- DECK (content) ---------- */
#deck{padding:calc(var(--safe-t) + 18px) 18px calc(var(--safe-b) + 28px);
  background:radial-gradient(130% 40% at 50% 0%,#0B3230 0%,rgba(11,50,48,0) 70%),#03111A;
  animation:deckIn .7s cubic-bezier(.2,.7,.2,1) both}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:6px 2px 4px}
.wingwrap{position:relative;flex:none;width:112px;animation:wingGlow 3s ease-in-out infinite}
.wingwrap img{display:block;width:100%;height:auto}
.wingwrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,250,220,.95) 50%,rgba(255,255,255,0) 62%);background-size:260% 100%;background-position:160% 0;
  -webkit-mask:url(assets/wing.webp) center/contain no-repeat;mask:url(assets/wing.webp) center/contain no-repeat;animation:wingSheen 3.2s ease-in-out infinite}
.track{position:relative;height:22px;margin:8px 2px 0}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;background:rgba(244,247,245,.55)}
.fr{position:absolute;top:50%;left:0;width:22px;height:22px;margin-top:-11px;animation:frFly 7s linear infinite}
.fr::before{content:"";position:absolute;right:16px;top:50%;width:110px;height:2px;margin-top:-1px;border-radius:2px;background:linear-gradient(90deg,rgba(242,201,76,0),#F2C94C)}
.fr svg{position:relative;display:block;filter:drop-shadow(0 0 6px rgba(255,210,63,.6))}
.hello-row{display:flex;align-items:flex-end;gap:6px;margin:16px 2px 18px}
.pilot{flex:none;display:block;width:54px;height:auto;margin-bottom:-2px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45));animation:pilotBob 3s ease-in-out infinite}
@keyframes pilotBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wave{transform-box:view-box;transform-origin:60px 66px;animation:wave .7s ease-in-out infinite alternate}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes wingGlow{0%,100%{filter:drop-shadow(0 4px 8px rgba(0,0,0,.45)) drop-shadow(0 0 4px rgba(242,201,76,.15))}50%{filter:drop-shadow(0 4px 8px rgba(0,0,0,.45)) drop-shadow(0 0 12px rgba(242,201,76,.55))}}
@keyframes wingSheen{0%,35%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes frFly{0%{left:-24px;opacity:0}6%{opacity:1}94%{opacity:1}100%{left:calc(100% + 2px);opacity:0}}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(16deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.top .name{display:flex;flex-direction:column;gap:5px;line-height:1}
.top .name b{font-family:"Barlow Condensed",Inter,sans-serif;font-size:clamp(24px,7.4vw,31px);font-weight:800;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;color:#FFFFFF;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.top .name b{display:inline-block;animation:ttlGlow 2.4s ease-in-out infinite,ttlShake 4.2s ease-in-out infinite}
.top .name b em{font-style:normal;background:linear-gradient(100deg,#C48A22 0%,#F2C94C 30%,#FFF6CF 45%,#F2C94C 60%,#C48A22 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ttlShine 2.6s linear infinite}
@keyframes ttlShine{from{background-position:120% 0}to{background-position:-130% 0}}
@keyframes ttlGlow{0%,100%{text-shadow:0 2px 10px rgba(0,0,0,.5),0 0 0 rgba(242,201,76,0);filter:drop-shadow(0 0 0 rgba(242,201,76,0))}50%{text-shadow:0 2px 10px rgba(0,0,0,.5),0 0 14px rgba(255,255,255,.35);filter:drop-shadow(0 0 8px rgba(242,201,76,.55))}}
@keyframes ttlShake{0%,86%,100%{transform:translate(0,0) rotate(0)}88%{transform:translate(-1.5px,.5px) rotate(-.6deg)}90%{transform:translate(1.5px,-.5px) rotate(.6deg)}92%{transform:translate(-1px,.5px) rotate(-.4deg)}94%{transform:translate(1px,0) rotate(.3deg)}96%{transform:translate(-.5px,0)}}
.top .name span{display:flex;align-items:center;gap:8px;font-family:"Barlow Condensed",Inter,sans-serif;font-size:15px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#E6C36A}
.top .name span::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,#E6C36A,rgba(230,195,106,0))}
.hello{margin:0;white-space:nowrap;font-family:"Barlow Condensed",Inter,sans-serif;font-size:30px;font-weight:700;letter-spacing:.04em}
.sub{margin:0 2px 18px;font-size:14px;color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:150px;padding:16px 14px 14px;text-align:left;cursor:pointer;
  border-radius:18px;border:1px solid rgba(159,194,182,.2);color:var(--ink);
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  transition:transform .15s ease,border-color .15s ease,background-color .15s ease}
.card{transition:transform .2s ease,border-color .2s ease,box-shadow .25s ease,background-color .25s ease}
.card .chip{transition:box-shadow .25s ease,transform .25s ease,filter .25s ease}
.card:hover,.card.lit{transform:translateY(-3px);border-color:rgba(242,201,76,.9);background-color:rgba(242,201,76,.08);
  box-shadow:0 0 0 1px rgba(242,201,76,.35),0 10px 26px rgba(0,0,0,.45),0 0 26px rgba(242,201,76,.28)}
.card:hover .chip,.card.lit .chip{transform:scale(1.08);filter:brightness(1.35);box-shadow:0 0 16px rgba(242,201,76,.45)}
.card:hover .ct,.card.lit .ct{color:#FFF3C4}
.card.flash{animation:cardFlash .6s ease-out}
@keyframes cardFlash{0%{box-shadow:0 0 0 0 rgba(242,201,76,.75),0 0 30px rgba(242,201,76,.6)}100%{box-shadow:0 0 0 14px rgba(242,201,76,0),0 0 26px rgba(242,201,76,.28)}}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card.wide{grid-column:1 / -1;min-height:auto;flex-direction:row;align-items:center}
.chip{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.num{position:absolute;top:14px;right:14px;font-family:"Barlow Condensed",Inter,sans-serif;font-size:14px;font-weight:700;letter-spacing:.1em;color:rgba(159,194,182,.6)}
.card .ct{font-size:15px;font-weight:600;line-height:1.3}
.card .cd{font-size:12.5px;line-height:1.45;color:var(--muted)}
.soon{margin-top:auto;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(242,201,76,.45);border-radius:999px;padding:3px 8px}
.card.wide .soon{margin:0 0 0 auto}
.back{margin:22px auto 0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(159,194,182,.4);background:transparent;color:var(--ink);font-size:14px;font-weight:500}
.back:hover{background:rgba(255,255,255,.06)}
.back:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.note{margin:14px 0 0;text-align:center;font-size:11px;color:#8FB0A6}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:20;
  max-width:88vw;padding:12px 18px;border-radius:14px;background:#F4F7F5;color:#03111A;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .25s ease,transform .25s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes fly{0%{transform:translate3d(0,18px,0)}100%{transform:translate3d(calc(100vw + 200px),-10px,0)}}
@keyframes bob{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-3px)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes strobe{0%,78%,84%,100%{opacity:0}80%,82%,88%,90%{opacity:1}86%{opacity:0}}
@keyframes deckIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.flight{left:14px}}
@media (max-width:600px){.pp-runway{height:130px!important}.pp-eyebrow{font-size:13px!important;letter-spacing:.3em!important;gap:10px!important}.pp-eyebrow span[aria-hidden]{width:24px!important}}

:root{--rwh:220px}
@media (max-width:600px){:root{--rwh:130px}}
.ap{position:absolute;bottom:calc(var(--rwh) - 1px);z-index:1;pointer-events:none}
.ap-tower{left:3%;width:56px;height:160px}
.ap-term{right:0;width:91px;height:73px}
@media (min-width:700px){.ap-tower{left:11%;width:84px;height:240px}.ap-term{right:5%;width:142px;height:114px}}
.twr-beacon{animation:apBeacon 1.6s ease-in-out infinite}
.twr-glass{animation:apGlass 5s ease-in-out infinite}
.rot-g{animation:apRotG 2s steps(1,end) infinite}
.rot-w{animation:apRotW 2s steps(1,end) infinite}
.papi{animation:apPapi 3s ease-in-out infinite}
.ws{transform-box:view-box;animation:wsWave 1.1s ease-in-out infinite alternate}
.ws-gust{transform-box:view-box;animation:wsGust 6s ease-in-out infinite}
.depart{position:absolute;left:50%;bottom:6px;width:120px;z-index:4;pointer-events:none;opacity:0;transform:translate(-50%,0) scale(1);transform-origin:50% 100%}
.depart.go{animation:apDepart 1.7s cubic-bezier(.55,0,.85,.55) forwards}
.depart .dl{animation:pulse 1.1s ease-in-out infinite}
@keyframes apBeacon{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes apGlass{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes apRotG{0%{opacity:1}50%{opacity:0}}
@keyframes apRotW{0%{opacity:0}50%{opacity:1}}
@keyframes apPapi{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes wsWave{from{transform:rotate(-3.5deg)}to{transform:rotate(4deg)}}
@keyframes wsGust{0%,100%{transform:rotate(2deg) scaleX(1)}40%{transform:rotate(9deg) scaleX(.9)}60%{transform:rotate(-2deg) scaleX(1.02)}}
@keyframes apDepart{0%{opacity:1;transform:translate(-50%,0) scale(1)}72%{opacity:1;transform:translate(-50%,calc(-1 * var(--rwh) + 14px)) scale(.2)}100%{opacity:0;transform:translate(-50%,calc(-1 * var(--rwh) - 70px)) scale(.12) rotate(-2deg)}}

/* ---------- BAV PILOT splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(80% 60% at 50% 45%,#0C2440 0%,#071827 60%,#040E18 100%);transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-stage{position:relative;width:min(84vw,62vh,440px);aspect-ratio:1}
.sp-stage>*{position:absolute}
.sp-radar{left:11%;top:8.8%;width:78%;height:78%}
.sp-ring{width:100%;height:100%;overflow:visible}
.sp-ring .r1{stroke-dasharray:1131;stroke-dashoffset:1131;animation:spDraw 1s cubic-bezier(.6,0,.2,1) .05s forwards}
.sp-ring .tk{opacity:0;animation:spFade .6s ease .6s forwards}
.sp-orbit{transform-box:view-box;transform-origin:200px 200px;opacity:0;animation:spFade .3s ease .9s forwards,spSpin 2.4s linear .9s infinite}
.sp-sweep{inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(34,200,240,0) 0deg,rgba(34,200,240,0) 280deg,rgba(34,200,240,.42) 358deg,rgba(155,235,255,.9) 360deg);
  -webkit-mask:radial-gradient(circle,#000 0 68%,transparent 70%);mask:radial-gradient(circle,#000 0 68%,transparent 70%);opacity:0;animation:spFade .4s ease .25s forwards,spSpin 1.8s linear .25s infinite;mix-blend-mode:screen}
.sp-globe{left:0;top:68.3%;width:100%;height:31.7%;opacity:0;animation:spFade .9s ease .5s forwards}
.sp-plane{left:18.555%;top:21.429%;width:59.278%;height:16.995%;opacity:0;animation:spPlane 1.1s cubic-bezier(.2,.75,.2,1) .35s forwards,spFloat 3.2s ease-in-out 1.5s infinite}
.sp-word{left:2.463%;top:38.342%;width:95.074%;height:31.691%;opacity:0;animation:spWord .7s cubic-bezier(.2,.75,.2,1) .75s forwards}
.sp-shine{left:2.463%;top:38.342%;width:95.074%;height:31.691%;overflow:hidden;-webkit-mask:url(branding/splash-bav-mask.png) center/100% 100% no-repeat;mask:url(branding/splash-bav-mask.png) center/100% 100% no-repeat}
.sp-shine::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;transform:skewX(-20deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(255,255,255,0));animation:spShine .9s ease-in-out 1.25s forwards;opacity:.0}
.sp-pilot{left:25.205%;top:64.86%;width:49.589%;height:6.322%;opacity:0;animation:spPilot .6s ease 1.45s forwards}
.sp-skip{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);margin:0;text-align:center;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:rgba(155,235,255,.55);opacity:0;animation:spFade .6s ease 1.6s forwards}
.sp-stage img{display:block;max-width:none}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFade{to{opacity:1}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spPlane{0%{opacity:0;transform:translate(-14%,22%) scale(.82)}100%{opacity:1;transform:none}}

    <div class="track" aria-hidden="true"><span class="fr"><svg width="22" height="22" viewBox="0 0 24 24"><g transform="rotate(90 12 12)"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#FFD23F" stroke="#5A4300" stroke-width=".6"/></g></svg></span></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  // ---- content cards (sections follow the user's Aviation library) ----
  var icons={
    book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/>',
    cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
    pcap:'<path d="M2.5 9.5C2.5 5.5 21.5 5.5 21.5 9.5L18.5 12.5h-13z"/><path d="M5.5 12.5h13v2.6h-13z"/><path d="M5.5 15.1c2.5 3 10.5 3 13 0"/><circle cx="12" cy="9.2" r="1.3"/><path d="M9 9.2H7M15 9.2h2"/>',
    form:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',
    quiz:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l1.5 1.5L12 7"/><path d="M8 14l1.5 1.5L12 13"/><path d="M14 8h3M14 14h3"/>',
    shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/>',
    id:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 16.5c.8-1.6 2-2.5 3.5-2.5s2.7.9 3.5 2.5"/><path d="M15 10h3M15 14h3"/>',
    play:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/>'
  };
  var items=[
    {n:'01',t:'Hồ sơ phi công',d:'Chứng chỉ, bằng cấp, giấy tờ cá nhân, LOSA.',i:'pcap',c:'#E6C36A'},
    {n:'02',t:'Tài liệu hiện hành',d:'FCOM, FCTM, QRH, SOP, FOM — bản đang hiệu lực.',i:'book',c:'#2F6BFF'},
    {n:'03',t:'Đào tạo - Huấn luyện',d:'CRM, EBT, SIM REC, TCAS, Crosswind.',i:'cap',c:'#8B5CF6'},
    {n:'04',t:'Ôn thi trắc nghiệm',d:'ATPL, Question bank CAAV, LIM quiz A320/A321, ELP ICAO.',i:'quiz',c:'#14B8A6'},
    {n:'05',t:'Video tham khảo',d:'CBT, SIM videos.',i:'play',c:'#EC4899'},
    {n:'06',t:'Tổng hợp Form',d:'Biểu mẫu thường dùng, tải nhanh khi cần.',i:'form',c:'#F97316'}
  ];
  var grid=document.getElementById('grid');
  items.forEach(function(it){
    var b=document.createElement('button');
    b.type='button'; b.className='card'+(it.wide?' wide':'');
    b.innerHTML='<span class="chip" style="background:'+it.c+'26;box-shadow:inset 0 0 0 1px '+it.c+'66">'+
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="'+it.c+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icons[it.i]+'</svg></span>'+
      (it.wide?'':'<span class="num">'+it.n+'</span>')+
      '<span style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="ct">'+it.t+'</span><span class="cd">'+it.d+'</span></span>'+
      '<span class="soon">Sắp có</span>';
    b.addEventListener('click',function(){var prev=grid.querySelector('.card.lit');if(prev&&prev!==b)prev.classList.remove('lit');b.classList.add('lit');b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');toast('“'+it.t+'” sẽ được xây dựng ở bước tiếp theo.');});
    grid.appendChild(b);
  });

  var tEl=document.getElementById('toast'), tTimer;
  function toast(msg){tEl.textContent=msg;tEl.classList.add('show');clearTimeout(tTimer);tTimer=setTimeout(function(){tEl.classList.remove('show');},2200);}

  // ---- navigation ----
  var cover=document.getElementById('cover'), deck=document.getElementById('deck');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('takeoff').addEventListener('click',function(){
    var dep=document.getElementById('depart'); dep.classList.remove('go'); void dep.offsetWidth; dep.classList.add('go');
    cover.classList.add('takeoff'); this.disabled=true;
    setTimeout(function(){cover.classList.add('leaving');}, reduce?0:1550);
    setTimeout(function(){document.getElementById('takeoff').disabled=false;cover.hidden=true;deck.hidden=false;window.scrollTo(0,0);var h=deck.querySelector('h2');h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}, reduce?0:2250);
  });
  document.getElementById('back').addEventListener('click',function(){
    deck.hidden=true; cover.classList.remove('takeoff','leaving'); document.getElementById('depart').classList.remove('go'); cover.hidden=false; window.scrollTo(0,0);
    document.getElementById('takeoff').focus({preventScroll:true});
  });
})();
</script>

<script>
(function(){
  var sp=document.getElementById('splash'); if(!sp) return;
  var seen=false; try{seen=sessionStorage.getItem('bavSplash')==='1';sessionStorage.setItem('bavSplash','1');}catch(e){}
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function done(){ if(sp.classList.contains('out')) return; sp.classList.add('out'); setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },500); }
  if(seen){ sp.parentNode.removeChild(sp); }
  else { sp.addEventListener('click',done); setTimeout(done, reduce?900:2600); }
  if('serviceWorker' in navigator && location.protocol==='https:' && window.top===window.self){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js?v=1').catch(function(){}); });
  }
})();
</script>
